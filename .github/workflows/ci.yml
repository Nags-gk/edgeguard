name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build -c Release
      - run: dotnet test tests/EdgeGuard.Authz.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-results, path: "tests/**/TestResults/**" }

  integration:
    needs: unit
    runs-on: ubuntu-latest
    env: { EDGEGUARD_URL: "http://localhost:8080", EDGEGUARD_ADMIN_KEY: "ci-admin-key" }
    steps:
      - uses: actions/checkout@v4
      - name: Build image (Envoy + authz)
        run: docker build -t edgeguard:ci .
      - name: Start gateway
        run: |
          docker run -d --name eg -p 8080:8080 -e EdgeGuard__AdminKey=$EDGEGUARD_ADMIN_KEY edgeguard:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/healthz && break; sleep 1; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest requests
      - name: Black-box integration tests
        run: pytest -q tests/integration --junitxml=integration.xml
      - name: Load smoke (k6, 300 rps for 20s, must stay error-free)
        run: |
          # Fresh gateway with the per-identity velocity thresholds raised: 3 load-test identities at
          # 300 rps would otherwise (correctly) be flagged high-risk and contained by the risk engine.
          docker rm -f eg
          docker run -d --name eg -p 8080:8080 -e EdgeGuard__AdminKey=$EDGEGUARD_ADMIN_KEY \
            -e EdgeGuard__Risk__MediumRequestsPer10s=10000000 -e EdgeGuard__Risk__HighRequestsPer10s=10000000 edgeguard:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/healthz && break; sleep 1; done
          docker run --rm --network host --user "$(id -u)" -v $PWD/loadtest:/s grafana/k6 run -q \
            -e RATE=300 -e DURATION=20s --summary-export=/s/ci-summary.json /s/k6.js
      - name: Gateway logs
        if: failure()
        run: docker logs eg | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-results, path: "integration.xml\nloadtest/ci-summary.json" }

# EdgeGuard data path. Every request to a published app or internet destination is checked by
# the external authorization service before it is routed; credentials are stripped at the edge.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }

static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    per_connection_buffer_limit_bytes: 32768
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          codec_type: AUTO
          use_remote_address: true
          xff_num_trusted_hops: 1          # one trusted front end (Cloud Run / load balancer)
          generate_request_id: true
          normalize_path: true             # defeat /apps/../apps/hr style policy bypass
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          common_http_protocol_options: { idle_timeout: 60s, headers_with_underscores_action: REJECT_REQUEST }
          request_timeout: 30s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  type: edgeguard.access
                  ts: "%START_TIME%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  retries: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                  decision_id: "%RESP(X-EG-DECISION-ID)%"
                  client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
          route_config:
            name: edgeguard
            virtual_hosts:
            - name: edgeguard
              domains: ["*"]
              routes:
              # Private applications (Private Access): authorized, retried, outlier-protected.
              - match: { prefix: "/apps/" }
                route:
                  cluster: apps
                  timeout: 5s
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 2
                    per_try_timeout: 2s
                    retry_back_off: { base_interval: 0.01s, max_interval: 0.1s }
              # Internet traffic (Secure Web Gateway): authorized and web-content filtered.
              - match: { prefix: "/internet/" }
                route: { cluster: apps, timeout: 5s }
              # Envoy's own Prometheus stats, read-only, exact path only (admin stays on localhost).
              - match: { path: "/envoy/stats", headers: [{ name: ":method", string_match: { exact: "GET" } }] }
                route: { cluster: envoy_admin, prefix_rewrite: "/stats/prometheus" }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              # Demo token minting gets a tighter bucket than the rest of the site.
              - match: { prefix: "/api/demo/token" }
                route: { cluster: console }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: demo_token_ratelimit
                    token_bucket: { max_tokens: 20, tokens_per_fill: 20, fill_interval: 1s }
                    filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
                    filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
              # Console, APIs and metrics: public, not behind ext_authz.
              - match: { prefix: "/" }
                route: { cluster: console, timeout: 10s }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
          http_filters:
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: ingress_ratelimit
              token_bucket: { max_tokens: 2000, tokens_per_fill: 2000, fill_interval: 1s }
              filter_enabled: { default_value: { numerator: 100, denominator: HUNDRED } }
              filter_enforced: { default_value: { numerator: 100, denominator: HUNDRED } }
              response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: x-local-rate-limit, value: "true" }
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false      # fail closed: no decision, no access
              status_on_error: { code: ServiceUnavailable }
              grpc_service:
                envoy_grpc: { cluster_name: authz }
                timeout: 0.25s
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: authz
    type: STATIC
    connect_timeout: 0.25s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    circuit_breakers:
      thresholds:
      - { max_connections: 1024, max_pending_requests: 1024, max_requests: 4096, max_retries: 3 }
    load_assignment:
      cluster_name: authz
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9001 } } } }] }]

  - name: apps
    type: STATIC
    connect_timeout: 0.5s
    circuit_breakers:
      thresholds:
      - { max_connections: 1024, max_pending_requests: 512, max_requests: 2048, max_retries: 64 }
    outlier_detection:
      consecutive_5xx: 5
      interval: 5s
      base_ejection_time: 10s
      max_ejection_percent: 50
    load_assignment:
      cluster_name: apps
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9003 } } } }] }]

  - name: console
    type: STATIC
    connect_timeout: 0.5s
    load_assignment:
      cluster_name: console
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9002 } } } }] }]

  - name: envoy_admin
    type: STATIC
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: envoy_admin
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9901 } } } }] }]

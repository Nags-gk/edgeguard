syntax = "proto3";
package envoy.service.auth.v3;
import "google/protobuf/timestamp.proto";
import "envoy/config/core/v3/address.proto";
option csharp_namespace = "Envoy.Service.Auth.V3";
// Subset of envoy/service/auth/v3/attribute_context.proto (same field numbers).
message AttributeContext {
  message Peer {
    envoy.config.core.v3.Address address = 1;
    string service = 2;
    map<string, string> labels = 6;
    string principal = 7;
    string certificate = 8;
  }
  message Request {
    google.protobuf.Timestamp time = 1;
    HttpRequest http = 2;
  }
  message HttpRequest {
    string id = 1;
    string method = 2;
    map<string, string> headers = 3;
    string path = 4;
    string host = 5;
    string scheme = 6;
    string query = 7;
    string fragment = 8;
    int64 size = 9;
    string protocol = 10;
    string body = 11;
  }
  Peer source = 1;
  Peer destination = 2;
  Request request = 4;
  map<string, string> context_extensions = 10;
}
